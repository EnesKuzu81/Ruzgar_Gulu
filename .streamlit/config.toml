# Tema: gece laciverti kenar çubuğu, açık içerik alanı, gökyüzü mavisi ana renk.
[theme]
base = "light"
primaryColor = "#0369A1"
backgroundColor = "#EEF3F8"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
font = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
headingFont = "Fira Sans:https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap"
codeFont = "Fira Code:https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap"
baseRadius = "10px"
buttonRadius = "8px"
borderColor = "#DCE3EC"
showWidgetBorder = true
dataframeBorderColor = "#E2E8F0"
dataframeHeaderBackgroundColor = "#F1F5F9"
dataframeHeaderTextColor = "#334155"
linkColor = "#0369A1"
blueBackgroundColor = "#E0F2FE"
blueTextColor = "#075985"
metricValueFontWeight = 600
chartCategoricalColors = ["#0369A1", "#F59E0B", "#E5484D", "#0EA5E9", "#64748B"]

[theme.sidebar]
backgroundColor = "#0B1726"
secondaryBackgroundColor = "#152A42"
textColor = "#E2E8F0"
primaryColor = "#0284C7"
borderColor = "#24405F"

[browser]
gatherUsageStats = false
